[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ransomware2stix"
version = "0.0.4"
authors = [
  { name="DOGESEC", email="support@dogesec.com" },
]
description = "ransomware2stix is a command line tool that takes data from ransomware.live and turn it into STIX objects"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "stix2",
    "python-arango>=8.1.3; python_version >= '3.8'",
    "tqdm>=4.66.4; python_version >= '3.7'",
    "jsonschema>=4.22.0; python_version >= '3.8'",
    "requests>=2.31.0; python_version >= '3.7'",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "stix2extensions @https://github.com/muchdogesec/stix2extensions/releases/download/main-2025-02-12-06-23-37/stix2extensions-0.0.3-py3-none-any.whl",
  ]
[project.urls]
Homepage = "https://github.com/muchdogesec/ransomware2stix"
Issues = "https://github.com/muchdogesec/ransomware2stix/issues"

[tool]
hatch.metadata.allow-direct-references = true
